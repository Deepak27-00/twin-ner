[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinner"
version = "1.0.0"
description = "Joint intent classification and BILOU entity extraction for digital-twin assistants"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["nlp", "ner", "bert", "intent-classification", "digital-twin", "chatbot", "iot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "numpy>=1.23",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "httpx>=0.25",
]

[project.scripts]
twinner = "twinner.cli:main"

[project.urls]
Homepage = "https://github.com/Deepak27-00/twin-ner"
Issues = "https://github.com/Deepak27-00/twin-ner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twinner = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Body() defaults are idiomatic
