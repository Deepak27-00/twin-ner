# Twin-NER configuration. Every run is fully described by this file plus the
# dataset it points at. Copy it, edit it, pass it with `--config my.yaml`.

data:
  raw_csv: data/raw/sensor_queries.csv
  processed_dir: data/processed
  text_column: text
  intent_column: intent
  entity_column: entities
  # Add an entry to teach the pipeline a new entity type. The key becomes the
  # BILOU tag suffix (B-SENSOR, U-TWIN, ...); the value is the key used inside
  # the dataset's `entities` column.
  entities:
    SENSOR: sensorType
    TWIN: digitalTwinID
  null_values: ["not present", "none", "n/a", "null", "-"]
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42

model:
  encoder: bert-base-uncased
  max_length: 64
  dropout: 0.1
  intent_loss_weight: 1.0

train:
  epochs: 8
  batch_size: 16
  eval_batch_size: 32
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  patience: 3
  seed: 42
  device: auto          # auto | cpu | cuda | mps
  output_dir: artifacts
  checkpoint_name: twinner.pt

serve:
  host: 127.0.0.1
  port: 8000
  cors_origins: []      # e.g. ["http://localhost:3000"]; never "*" in production
  max_batch_size: 64
  max_text_length: 2000
